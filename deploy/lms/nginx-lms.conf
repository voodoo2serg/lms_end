# Snippet: terminate TLS on the home edge, proxy loopback LMS ports only.
# BBB (server C) is not included — keep its own upstream.

# Adapter API on 18083 (voronka owns 18080 on shared VPS). Keycloak 18081 · OpenOlat 18082.
upstream lms_api { server 127.0.0.1:18083; }
upstream lms_auth { server 127.0.0.1:18081; }
upstream lms_learn { server 127.0.0.1:18082; }

server {
  listen 443 ssl http2;
  server_name api.example.ru;
  # ssl_certificate / ssl_certificate_key — operator-managed
  location / {
    proxy_pass http://lms_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name auth.example.ru;
  location / {
    proxy_pass http://lms_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl http2;
  server_name learn.example.ru;
  location / {
    proxy_pass http://lms_learn;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600;
  }
}
