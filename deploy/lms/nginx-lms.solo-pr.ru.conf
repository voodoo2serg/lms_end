# Target host wiring for https://lms.solo-pr.ru (docs only this phase — no VPS apply).
# Portal UI + meeting BFF: portal :3040 · Adapter enrollment/learning: :18080
# BBB media plane is NOT proxied here.
#
# Meeting store consistency: browser calls ONLY portal `/api/meetings/*`
# (including questions/attendance/sparks). Portal BFF uses one store —
# local stub OR delegates to adapter with Bearer MEETINGS_API_TOKEN when
# LMS_END_URL is set. Do not split /api/questions|/api/attendance to a
# different upstream.

upstream lms_portal { server 127.0.0.1:3040; }
upstream lms_adapter { server 127.0.0.1:18080; }

server {
  listen 80;
  listen [::]:80;
  server_name lms.solo-pr.ru;

  location /api/integrations/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/learning/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Direct adapter meeting API for M2M tooling (Bearer). Browser UX uses portal.
  location /adapter/api/meetings {
    rewrite ^/adapter(/api/meetings.*)$ $1 break;
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /adapter/health {
    proxy_pass http://lms_adapter/health;
  }

  # Portal: UI + cookie-auth BFF for /api/meetings|/api/auth|/api/enrollments|…
  location / {
    proxy_pass http://lms_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
