# Target host wiring for https://lms.solo-pr.ru (docs only this phase — no VPS apply).
# Portal UI: LMS_for_edu :3040 · Adapter: this compose :18080
# BBB media plane is NOT proxied here.

upstream lms_portal { server 127.0.0.1:3040; }
upstream lms_adapter { server 127.0.0.1:18080; }

server {
  listen 80;
  listen [::]:80;
  server_name lms.solo-pr.ru;

  location /api/integrations/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/learning/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Adapter meeting stubs (SoR journal). Portal may also expose UX stubs under /api/meetings
  # when LMS_END_URL is unset; after cutover prefer adapter for persistence.
  location /api/meetings {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /adapter/health {
    proxy_pass http://lms_adapter/health;
  }

  location / {
    proxy_pass http://lms_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
