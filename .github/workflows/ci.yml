name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app migrations tests
      - run: python -m pytest -q
      - run: cp .env.example .env
      - run: docker compose --env-file .env.example config --quiet

  lms-adapter:
    # LMS-11: adapter + OpenOlat client contracts without full CRM commerce suite.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
      ACCESS_AUTHORITY: external
      OWNER_TELEGRAM_ID: 123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_grant_sync.py tests/test_learning_migration.py tests/test_learning.py tests/test_meeting_stubs.py -k "openolat or grant or schema or checkout_gone or course_enter or hmac or legacy_course or meeting or attendance or spark or meta"
      - run: |
          cp .env.example .env
          # Minimal pins so compose.lms.yaml config validates without real WAR/Keycloak pulls.
          # Use '|' delimiters — replacement URLs contain '/'.
          sed -i 's|^KEYCLOAK_VERSION=.*|KEYCLOAK_VERSION=26.0.0|' .env
          sed -i 's|^OPENOLAT_WAR_URL=.*|OPENOLAT_WAR_URL=https://example.invalid/openolat.war|' .env
          sed -i 's|^OPENOLAT_WAR_SHA256=.*|OPENOLAT_WAR_SHA256=deadbeef|' .env
          sed -i 's|^LEARNING_DB_ROOT_PASSWORD=.*|LEARNING_DB_ROOT_PASSWORD=test|' .env
          sed -i 's|^OPENOLAT_DB_PASSWORD=.*|OPENOLAT_DB_PASSWORD=test|' .env
          sed -i 's|^KEYCLOAK_DB_PASSWORD=.*|KEYCLOAK_DB_PASSWORD=test|' .env
          sed -i 's|^KEYCLOAK_ADMIN_PASSWORD=.*|KEYCLOAK_ADMIN_PASSWORD=test|' .env
          sed -i 's|^OPENOLAT_OIDC_SECRET=.*|OPENOLAT_OIDC_SECRET=testsecret|' .env
          sed -i 's|^AUTH_DOMAIN=.*|AUTH_DOMAIN=auth.example.ru|' .env
          sed -i 's|^LEARN_DOMAIN=.*|LEARN_DOMAIN=learn.example.ru|' .env
      - run: docker compose -f compose.lms.yaml --env-file .env config --quiet

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funnel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: funnel
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U funnel -d funnel"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      OWNER_TELEGRAM_ID: 123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: funnel
          POSTGRES_PASSWORD: test
          POSTGRES_DB: funnel
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U funnel -d funnel"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      TEST_DATABASE_URL: postgresql+psycopg://funnel:test@localhost:5432/funnel
      REDIS_URL: redis://localhost:6379/0
      OWNER_TELEGRAM_ID: 123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_operational.py tests/test_crm.py tests/test_learning.py tests/test_grant_sync.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voronka:test .
      - run: docker run --rm --entrypoint ffprobe voronka:test -version
      - run: docker run --rm -v voronka-ci-media:/data/media --entrypoint python voronka:test -c "from pathlib import Path; p=Path('/data/media/write-test'); p.write_text('ok'); p.unlink()"
  browser:
    runs-on: ubuntu-latest
    env:
      RUN_BROWSER: '1'
      DATABASE_URL: sqlite://
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm run --prefix web build
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_editor_browser.py tests/test_crm_browser.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix web
      - run: npm run --prefix web build
      - run: npm run --prefix web typecheck

  site:
    # Vendored site/ is a frozen archive (LMS-1); keep a smoke job but tolerate
    # Next.js SQLite "database is locked" flakes during parallel page collection.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix site --legacy-peer-deps
      - run: npm run --prefix site typecheck
      - name: build:vps (retry on sqlite lock flake)
        run: |
          for attempt in 1 2 3; do
            if npm run --prefix site build:vps; then
              exit 0
            fi
            echo "build:vps attempt $attempt failed; retrying..."
            rm -rf site/.next
            sleep $((attempt * 2))
          done
          exit 1
      - run: npm run --prefix site test:integration
      - run: node site/tests/learning.integration.mjs
