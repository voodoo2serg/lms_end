# Target host wiring for https://lms.solo-pr.ru (+ auth / learn).
# Portal UI + meeting BFF: portal :3040 · Adapter enrollment/learning: :18083
# Keycloak: :18081 · OpenOlat: :18082
# BBB media plane is NOT proxied here.
#
# Port remap: LMS adapter MUST use 18083 on the shared VPS (voronka owns 18080).
#
# Meeting store consistency: browser calls ONLY portal `/api/meetings/*`
# (including questions/attendance/sparks). Portal BFF uses one store —
# local stub OR delegates to adapter with Bearer MEETINGS_API_TOKEN when
# LMS_END_URL is set. Do not split /api/questions|/api/attendance to a
# different upstream.

upstream lms_portal { server 127.0.0.1:3040; }
upstream lms_adapter { server 127.0.0.1:18083; }
upstream lms_auth { server 127.0.0.1:18081; }
upstream lms_learn { server 127.0.0.1:18082; }

# --- LMS portal + adapter paths on lms.solo-pr.ru ---
server {
  listen 80;
  listen [::]:80;
  server_name lms.solo-pr.ru;

  location /api/integrations/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/learning/ {
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Prefix proxy for M2M / tooling: strip /adapter → adapter root (health, meetings, …).
  # LEARNING_API_URL for solo_pr should be https://lms.<domain> (not …/adapter) —
  # /api/learning and /api/integrations are mapped above without the prefix.
  location /adapter/ {
    rewrite ^/adapter/(.*)$ /$1 break;
    proxy_pass http://lms_adapter;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /adapter/health {
    proxy_pass http://lms_adapter/health;
  }

  # Portal: UI + cookie-auth BFF for /api/meetings|/api/auth|/api/enrollments|…
  location / {
    proxy_pass http://lms_portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

# --- Keycloak IdP (requires DNS A for auth.solo-pr.ru → VPS) ---
server {
  listen 80;
  listen [::]:80;
  server_name auth.solo-pr.ru;

  location / {
    proxy_pass http://lms_auth;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }
}

# --- OpenOlat learn UI (requires DNS A for learn.solo-pr.ru → VPS) ---
server {
  listen 80;
  listen [::]:80;
  server_name learn.solo-pr.ru;

  client_max_body_size 200m;

  location / {
    proxy_pass http://lms_learn;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
  }
}
