# Include inside the HTTPS server for the public site on server A.
# Replace 10.10.0.2 with server B's VPN address. Never expose its database ports.
location /crm/ { proxy_pass https://api.example.ru; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
location /api/crm/ { proxy_pass https://api.example.ru; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
location /api/learning/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
location /api/portal/ { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
location /api/ { proxy_pass https://api.example.ru; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_ssl_server_name on; proxy_ssl_name api.example.ru; }
